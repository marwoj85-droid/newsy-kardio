# Co 4 godziny: pobiera nowe publikacje (PubMed + Elsevier) i publikuje aplikację na GitHub Pages.
name: Aktualizacja publikacji

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:   # ręczne uruchomienie z zakładki Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Adres strony
        id: pages
        uses: actions/configure-pages@v5

      - name: Sprawdź hasło
        env:
          KARDIO_PASSWORD: ${{ secrets.KARDIO_PASSWORD }}
        run: |
          if [ -z "$KARDIO_PASSWORD" ]; then
            echo "::error::Brak hasła. Dodaj secret KARDIO_PASSWORD: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Pobierz poprzednie (zaszyfrowane) dane z opublikowanej strony
        env:
          KARDIO_PASSWORD: ${{ secrets.KARDIO_PASSWORD }}
        run: |
          mkdir -p data
          BASE="${{ steps.pages.outputs.base_url }}"
          if curl -fsSL "$BASE/data/articles.enc.json" -o data/prev.enc.json; then
            node scripts/crypt.mjs decrypt data/prev.enc.json data/articles.json \
              || { echo "Poprzednich danych nie da się odszyfrować (zmienione hasło?) — zaczynam od nowa"; rm -f data/articles.json; }
          elif curl -fsSL "$BASE/data/articles.json" -o data/articles.json; then
            echo "Przejście z danych nieszyfrowanych"
          else
            echo "Brak poprzednich danych — pierwsze uruchomienie"
          fi

      - name: Pobierz nowe publikacje
        run: node lib/fetch.mjs

      - name: Zaszyfruj dane i złóż stronę
        env:
          KARDIO_PASSWORD: ${{ secrets.KARDIO_PASSWORD }}
        run: |
          rm -rf public/data
          node scripts/crypt.mjs encrypt data/articles.json public/data/articles.enc.json
          ls -la public/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publikuj
        id: deploy
        uses: actions/deploy-pages@v4

      # GitHub wyłącza harmonogram po 60 dniach bez zmian w repozytorium — raz w tygodniu mały commit
      - name: Podtrzymanie harmonogramu
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u%H)" = "100" ]; then
            date -u > .last-run
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .last-run && git commit -m "Podtrzymanie harmonogramu" && git push || true
          fi
